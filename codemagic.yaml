workflows:
  ios-release:
    name: iOS Release (manual signing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - aura_signing
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      ios_signing:
        provisioning_profiles:
          - profile: "AURA App Store Profile"
            environment_variable: AURA_PROVISIONING_PROFILE_PATH
        certificates:
          - certificate: "AURA Distribution"
            environment_variable: AURA_CERTIFICATE_PATH
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web app (TanStack Start)
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Initialize keychain for code signing
        script: |
          keychain initialize
      - name: Add certificate to keychain
        script: |
          keychain add-certificates \
            --certificate "$AURA_CERTIFICATE_PATH" \
            --certificate-password "@env:AURA_CERTIFICATE_PASSWORD"
      - name: Apply provisioning profile + certificate to Xcode project
        script: |
          xcode-project use-profiles
      - name: Resolve Swift Package dependencies (diagnóstico isolado)
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: List signing identities in keychain (diagnóstico do erro anterior)
        script: |
          echo "===== IDENTIDADES DE ASSINATURA DISPONÍVEIS NO KEYCHAIN ====="
          security find-identity -v -p codesigning
          echo "===== FIM DA LISTA ====="
      - name: Build .ipa (manual signing, sem publicar)
        script: |
          set -o pipefail
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --verbose \
          || BUILD_EXIT_CODE=$?
          echo "===== LOG COMPLETO DO XCODEBUILD (xcodebuild_logs) ====="
          if ls /tmp/xcodebuild_logs/*.log >/dev/null 2>&1; then
            cat /tmp/xcodebuild_logs/*.log
          else
            echo "(nenhum arquivo encontrado em /tmp/xcodebuild_logs/)"
          fi
          echo "===== FIM DO LOG ====="
          exit "${BUILD_EXIT_CODE:-0}"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  ios-simulator-preview:
    name: iOS Simulator Preview (screenshot, sem assinatura)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        SIMULATOR_NAME: "iPhone 15"
        APP_BUNDLE_ID: "com.auraagendaia.app"
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web app (TanStack Start)
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Build app for iOS Simulator (sem assinatura de código)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Instalar e abrir o app no simulador
        script: |
          set -e
          xcrun simctl boot "$SIMULATOR_NAME" || true
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name "App.app" -path "*iphonesimulator*" | head -1)
          echo "App encontrado em: $APP_PATH"
          xcrun simctl install booted "$APP_PATH"
          xcrun simctl launch booted "$APP_BUNDLE_ID"
          echo "Aguardando o app carregar (a WebView depende de rede)..."
          sleep 15
      - name: Capturar screenshot da tela inicial
        script: |
          mkdir -p screenshots
          xcrun simctl io booted screenshot screenshots/tela-inicial.png
    artifacts:
      - screenshots/*.png
