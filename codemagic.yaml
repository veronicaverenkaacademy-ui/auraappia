workflows:
  ios-release:
    name: iOS Release (manual signing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      ios_signing:
        provisioning_profiles:
          - profile: "AURA App Store Profile"
            environment_variable: AURA_PROVISIONING_PROFILE_PATH
        certificates:
          - certificate: "AURA Distribution"
            environment_variable: AURA_CERTIFICATE_PATH
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web app (TanStack Start)
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Initialize keychain for code signing
        script: |
          keychain initialize
      - name: Apply provisioning profile + certificate to Xcode project
        script: |
          xcode-project use-profiles
      - name: Build .ipa (manual signing, sem publicar)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
