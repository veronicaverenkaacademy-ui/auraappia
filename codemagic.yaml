workflows:
  ios-release:
    name: iOS Release (manual signing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - aura_signing
        - aura_publishing
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      ios_signing:
        provisioning_profiles:
          - profile: "AURA App Store Profile"
            environment_variable: AURA_PROVISIONING_PROFILE_PATH
        certificates:
          - certificate: "AURA Distribution"
            environment_variable: AURA_CERTIFICATE_PATH
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web app (TanStack Start)
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      # Auto-incrementa CURRENT_PROJECT_VERSION (CFBundleVersion) antes de cada
      # build — App Store Connect rejeita reenvio do mesmo número de build pra
      # mesma versão (MARKETING_VERSION), e não havia nenhum incremento automático
      # antes desta etapa (era fixo em "1" no pbxproj). Usa timestamp UTC com
      # segundos (AAAAMMDDHHmmss, 14 dígitos — a Apple aceita até 18) em vez de
      # alguma variável de build number própria do Codemagic (ex:
      # PROJECT_BUILD_NUMBER) — há relatos na comunidade de builds onde essa
      # variável não incrementa como esperado, e um timestamp não depende de
      # nenhum comportamento específico da plataforma de CI, sempre cresce, e não
      # exige estado entre builds. Granularidade de segundo (não só minuto) evita
      # colisão num rerun manual logo após uma falha, que pode acontecer bem
      # dentro do mesmo minuto. Precisa de VERSIONING_SYSTEM = apple-generic no
      # pbxproj (adicionado nesta mesma mudança) para o agvtool funcionar — sem
      # isso ele falha.
      - name: Auto-increment build number (agvtool)
        script: |
          set -eo pipefail
          cd ios/App
          NEW_BUILD_NUMBER=$(date -u +%Y%m%d%H%M%S)
          agvtool new-version -all "$NEW_BUILD_NUMBER"
          echo "CURRENT_PROJECT_VERSION definido para $NEW_BUILD_NUMBER"
      - name: Initialize keychain for code signing
        script: |
          keychain initialize
      - name: Add certificate to keychain
        script: |
          keychain add-certificates \
            --certificate "$AURA_CERTIFICATE_PATH" \
            --certificate-password "@env:AURA_CERTIFICATE_PASSWORD"
      - name: Apply provisioning profile + certificate to Xcode project
        script: |
          xcode-project use-profiles
      - name: Resolve Swift Package dependencies (diagnóstico isolado)
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: List signing identities in keychain (diagnóstico do erro anterior)
        script: |
          echo "===== IDENTIDADES DE ASSINATURA DISPONÍVEIS NO KEYCHAIN ====="
          security find-identity -v -p codesigning
          echo "===== FIM DA LISTA ====="
      - name: Build .ipa (manual signing, sem publicar)
        script: |
          set -o pipefail
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --verbose \
          || BUILD_EXIT_CODE=$?
          echo "===== LOG COMPLETO DO XCODEBUILD (xcodebuild_logs) ====="
          if ls /tmp/xcodebuild_logs/*.log >/dev/null 2>&1; then
            cat /tmp/xcodebuild_logs/*.log
          else
            echo "(nenhum arquivo encontrado em /tmp/xcodebuild_logs/)"
          fi
          echo "===== FIM DO LOG ====="
          exit "${BUILD_EXIT_CODE:-0}"
      - name: Sanity check — versão e flags reais da CLI app-store-connect
        script: |
          set -eo pipefail
          echo "===== app-store-connect --version ====="
          app-store-connect --version
          echo "===== app-store-connect publish --help (conferir --apple-id/--password/--beta-group aqui) ====="
          app-store-connect publish --help
      # Publicação via Apple ID + senha específica de app — fallback temporário
      # enquanto o bug de download de API Key da Apple (caso 20000145256294) não é
      # resolvido. Ver CLAUDE.md para o histórico completo e o plano de reversão
      # para API Key assim que a Apple destravar o download.
      #
      # --apple-id/--password usam o prefixo "@env:" (mesmo padrão já usado acima em
      # --certificate-password) — o próprio binário app-store-connect lê a env var
      # diretamente, em vez do shell interpolar o valor no argumento — evita que a
      # senha apareça em `ps`/histórico de processo.
      #
      # Sem --beta-group e sem --testflight nesta primeira versão: não há confirmação
      # de que a atribuição automática a grupo de teste funcione combinada com
      # Apple ID/senha (só é documentada como alternativa pra "validation and
      # upload") — ver CLAUDE.md. Atribuir ao grupo de teste manualmente no App Store
      # Connect por enquanto.
      - name: Publish to TestFlight (Apple ID + senha específica de app — fallback sem API Key)
        script: |
          set -eo pipefail
          app-store-connect publish \
            --path "build/ios/ipa/*.ipa" \
            --apple-id "@env:AURA_APPLE_ID" \
            --password "@env:AURA_APP_SPECIFIC_PASSWORD"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  ios-simulator-preview:
    name: iOS Simulator Preview (screenshot, sem assinatura)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_BUNDLE_ID: "com.auraagendaia.app"
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build web app (TanStack Start)
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Build app for iOS Simulator (sem assinatura de código)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Instalar e abrir o app no simulador
        script: |
          set -e
          echo "===== SIMULADORES DISPONÍVEIS NESTA MÁQUINA ====="
          xcrun simctl list devices available
          echo "===================================================="

          DEVICE_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable", True) and "iPhone" in d.get("name", ""):
                      print(d["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')

          if [ -z "$DEVICE_UDID" ]; then
            echo "Nenhum simulador de iPhone disponível foi encontrado na lista acima."
            exit 1
          fi
          echo "Simulador escolhido (UDID): $DEVICE_UDID"

          xcrun simctl boot "$DEVICE_UDID" || true

          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name "App.app" -path "*iphonesimulator*" | head -1)
          echo "App encontrado em: $APP_PATH"

          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_UDID" "$APP_BUNDLE_ID"
          echo "Aguardando o app carregar (a WebView depende de rede)..."
          sleep 15

          echo "$DEVICE_UDID" > /tmp/aura_sim_udid.txt
      - name: Capturar screenshot da tela inicial
        script: |
          mkdir -p "$CM_BUILD_DIR/screenshots"
          DEVICE_UDID=$(cat /tmp/aura_sim_udid.txt)
          xcrun simctl io "$DEVICE_UDID" screenshot "$CM_BUILD_DIR/screenshots/tela-inicial.png"
    artifacts:
      - screenshots/*.png
