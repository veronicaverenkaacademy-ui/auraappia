name: WhatsApp reminders cron

# Aciona o endpoint que já existe (src/lib/whatsapp/cron-endpoint.server.ts).
# Não processa nada aqui — só chama, a cada 5 minutos, o mesmo endpoint que
# faria a mesma coisa se você chamasse manualmente. Nenhuma lógica de
# notification_jobs/scheduler/WhatsAppMessageService vive neste arquivo.
on:
  schedule:
    - cron: "*/5 * * * *"
  # Permite disparar manualmente pela aba Actions do GitHub, sem esperar os
  # 5 minutos — útil para confirmar que o segredo/endpoint estão corretos.
  workflow_dispatch: {}

# Evita duas execuções sobrepostas chamando o endpoint ao mesmo tempo — o
# processamento em si já é seguro contra duplicidade (FOR UPDATE SKIP LOCKED),
# mas não há motivo pra rodar em paralelo; a próxima simplesmente espera.
concurrency:
  group: whatsapp-cron
  cancel-in-progress: false

jobs:
  trigger-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Chamar /api/cron/whatsapp-reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          echo "Execução iniciada em $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          response_file="$(mktemp)"
          http_status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            --max-time 300 \
            -X POST "https://auraappia.lovable.app/api/cron/whatsapp-reminders" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")"

          echo "HTTP status: ${http_status}"
          echo "Resposta agregada do endpoint (sem telefone/conteúdo de mensagem — o endpoint nunca devolve isso):"
          cat "$response_file"
          echo ""

          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo "::error::Endpoint retornou HTTP ${http_status} — a fila não foi processada nesta execução."
            exit 1
          fi
